<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root {
      --bg-from: #f8fafc;
      --bg-mid: #eef2ff;
      --bg-to: #f1f5f9;
      --card: rgba(255, 255, 255, 0.92);
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --label: #334155;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --hint-bg: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-from: #020617;
        --bg-mid: #0f172a;
        --bg-to: #020617;
        --card: rgba(15, 23, 42, 0.92);
        --border: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --label: #cbd5e1;
        --input-bg: #0f172a;
        --input-border: #334155;
        --primary: #6366f1;
        --primary-hover: #818cf8;
        --danger: #f87171;
        --danger-bg: #450a0a;
        --danger-border: #7f1d1d;
        --hint-bg: #1e293b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-from), var(--bg-mid), var(--bg-to));
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
    }

    .header { text-align: center; margin-bottom: 28px; }
    .logo {
      width: 48px; height: 48px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary);
      color: #fff;
      font-size: 18px; font-weight: 700;
      border-radius: 12px;
    }
    h1 { font-size: 24px; font-weight: 600; }
    .subtitle { margin-top: 4px; font-size: 14px; color: var(--muted); }

    form { display: flex; flex-direction: column; gap: 20px; }

    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: var(--label); }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .row label { margin-bottom: 0; }

    input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #94a3b8; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
    input.invalid { border-color: var(--danger); }
    input.invalid:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.25); }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 76px; }
    .toggle {
      position: absolute; top: 0; right: 0; bottom: 0;
      padding: 0 14px;
      font-size: 12px; font-weight: 500;
      color: var(--muted);
      background: none; border: none; cursor: pointer;
    }
    .toggle:hover { color: var(--text); }

    .field-error { margin-top: 6px; font-size: 12px; color: var(--danger); min-height: 0; }

    .form-error {
      display: none;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 8px;
    }
    .form-error.show { display: block; }

    a { font-size: 12px; font-weight: 500; color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .submit {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 10px 16px;
      font-size: 14px; font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none; border-radius: 8px; cursor: pointer;
      transition: background 0.15s;
    }
    .submit:hover { background: var(--primary-hover); }
    .submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .submit.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .signup { margin-top: 24px; text-align: center; font-size: 14px; color: var(--muted); }
    .signup a { font-size: 14px; }

    .hint {
      margin-top: 24px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--muted);
      background: var(--hint-bg);
      border-radius: 8px;
    }
    .hint strong { font-weight: 600; }

    /* Tela de sucesso */
    .success { display: none; text-align: center; }
    .success.show { display: block; }
    .success .check {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #fff;
      background: #16a34a;
      border-radius: 50%;
    }
    .success p { margin: 6px 0 20px; font-size: 14px; color: var(--muted); }
    .success button {
      padding: 10px 20px;
      font-size: 14px; font-weight: 600;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">

    <section id="login-view">
      <div class="header">
        <div class="logo">D</div>
        <h1>Bem-vindo de volta</h1>
        <p class="subtitle">Entre com sua conta para continuar</p>
      </div>

      <form id="login-form" novalidate>
        <div id="form-error" class="form-error" role="alert"></div>

        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" />
          <p id="email-error" class="field-error"></p>
        </div>

        <div>
          <div class="row">
            <label for="password">Senha</label>
            <a href="#">Esqueceu a senha?</a>
          </div>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button id="toggle" type="button" class="toggle" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <p id="password-error" class="field-error"></p>
        </div>

        <button id="submit" type="submit" class="submit">
          <span class="spinner"></span>
          <span id="submit-text">Entrar</span>
        </button>
      </form>

      <p class="signup">Não tem conta? <a href="#">Cadastre-se</a></p>
      <div class="hint"><strong>Demonstração:</strong> demo@exemplo.com / demo1234</div>
    </section>

    <section id="success-view" class="success">
      <div class="check">✓</div>
      <h1>Login realizado!</h1>
      <p>Página temporária. Substitua pelo seu sistema.</p>
      <button id="logout" type="button">Sair</button>
    </section>

  </main>

  <script>
    // Credenciais de demonstração (dados fictícios)
    var DEMO_USER = { email: "demo@exemplo.com", password: "demo1234" };

    var form = document.getElementById("login-form");
    var emailInput = document.getElementById("email");
    var passwordInput = document.getElementById("password");
    var emailError = document.getElementById("email-error");
    var passwordError = document.getElementById("password-error");
    var formError = document.getElementById("form-error");
    var submitBtn = document.getElementById("submit");
    var submitText = document.getElementById("submit-text");
    var toggleBtn = document.getElementById("toggle");
    var loginView = document.getElementById("login-view");
    var successView = document.getElementById("success-view");

    // Simula uma chamada ao servidor. Troque por fetch() quando houver back-end.
    function login(email, password) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          if (email.trim().toLowerCase() === DEMO_USER.email && password === DEMO_USER.password) {
            resolve({ ok: true });
          } else {
            resolve({ ok: false, message: "E-mail ou senha incorretos." });
          }
        }, 600);
      });
    }

    function validate(email, password) {
      var errors = {};
      if (!email.trim()) {
        errors.email = "Informe seu e-mail.";
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) {
        errors.email = "Digite um e-mail válido.";
      }
      if (!password) {
        errors.password = "Informe sua senha.";
      } else if (password.length < 6) {
        errors.password = "A senha deve ter pelo menos 6 caracteres.";
      }
      return errors;
    }

    function showFieldErrors(errors) {
      emailError.textContent = errors.email || "";
      passwordError.textContent = errors.password || "";
      emailInput.classList.toggle("invalid", !!errors.email);
      passwordInput.classList.toggle("invalid", !!errors.password);
    }

    toggleBtn.addEventListener("click", function () {
      var hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";
      toggleBtn.textContent = hidden ? "Ocultar" : "Mostrar";
      toggleBtn.setAttribute("aria-label", hidden ? "Ocultar senha" : "Mostrar senha");
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      formError.classList.remove("show");

      var errors = validate(emailInput.value, passwordInput.value);
      showFieldErrors(errors);
      if (errors.email || errors.password) return;

      submitBtn.disabled = true;
      submitBtn.classList.add("loading");
      submitText.textContent = "Entrando...";

      login(emailInput.value, passwordInput.value)
        .then(function (result) {
          if (result.ok) {
            loginView.style.display = "none";
            successView.classList.add("show");
          } else {
            formError.textContent = result.message;
            formError.classList.add("show");
          }
        })
        .catch(function () {
          formError.textContent = "Não foi possível entrar agora. Tente novamente em instantes.";
          formError.classList.add("show");
        })
        .then(function () {
          submitBtn.disabled = false;
          submitBtn.classList.remove("loading");
          submitText.textContent = "Entrar";
        });
    });

    document.getElementById("logout").addEventListener("click", function () {
      successView.classList.remove("show");
      loginView.style.display = "block";
      form.reset();
      showFieldErrors({});
    });
  </script>
</body>
</html>
